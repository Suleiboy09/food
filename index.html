<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Review Blog</title>
<style>
  :root{
    --card: #f0d9d6;
    --card-dark: #e6c4c1;
    --ink: #2b2320;
    --ink-soft: #6b5d58;
    --accent: #2f6690;
    --accent-light: #7fb3d5;
    --field: #ffffff;
    --page-bg: #eef2f1;
    --brand: #c0392b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--page-bg);
  }

  .stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, #ffffff 0%, #f7f7f5 45%, #eef2f1 100%);
  }

  .bg img {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: auto;
    max-width: 46%;
    object-fit: cover;
    object-position: left top;
    opacity: 0.96;
    -webkit-mask-image: linear-gradient(to right, black 78%, transparent 100%);
            mask-image: linear-gradient(to right, black 78%, transparent 100%);
  }

  .brand {
    position: absolute;
    top: 30px;
    right: 50%;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--brand);
    letter-spacing: 0.2px;
    z-index: 3;
  }
  .brand .emoji { font-size: 1.4rem; }

  .screen {
    position: relative;
    margin-left: 40%;
    z-index: 2;
    width: min(420px, 86vw);
    background: var(--card);
    border-radius: 26px;
    padding: 40px 34px 34px;
    box-shadow: 0 24px 60px rgba(43, 35, 32, 0.18);
    text-align: center;
    display: none;
    animation: rise 0.35s ease;

  }
  .screen.active { display: block; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .icon-badge {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: #fdfaf5;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-size: 1.6rem;
    box-shadow: 0 6px 14px rgba(0,0,0,0.08);
  }

  h1.title {
    margin: 0 0 24px;
    font-size: 1.35rem;
    font-weight: 700;
  }

  .field {
    text-align: left;
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
    padding-left: 4px;
  }
  .field input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 999px;
    border: none;
    background: var(--field);
    font-size: 0.9rem;
    color: var(--ink);
    outline: none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    transition: box-shadow 0.15s ease;
  }
  .field input:focus {
    box-shadow: inset 0 0 0 2px var(--accent-light);
  }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 22px;
    justify-content: center;
  }

  button {
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 8px 18px rgba(47,102,144,0.28);
  }
  .btn-secondary {
    background: var(--accent-light);
    color: #10334a;
    box-shadow: 0 8px 18px rgba(127,179,213,0.3);
  }
  .btn-ghost {
    background: #dcbdb9;
    color: #5a2e28;
  }

  .switch-note {
    margin-top: 18px;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .switch-note a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .switch-note a:hover { text-decoration: underline; }

  .home-text {
    font-size: 0.88rem;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 22px;
  }

  .home-stats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 6px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .stat-num {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label {
    font-size: 0.7rem;
    color: var(--ink-soft);
  }

  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2b2320;
    color: #fff;
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 10;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  /* Validation error message */
.error-message {
    color: #c0392b;
    font-size: 0.75rem;
    margin-top: 5px;
    padding-left: 8px;
}

/* Red border when input is invalid */
.input-error {
    box-shadow: inset 0 0 0 2px #c0392b !important;
}

/* Green border when input is valid */
.input-success {
    box-shadow: inset 0 0 0 2px #27ae60 !important;
}

  @media (max-width: 640px) {
    .bg img { max-width: 60%; }
    .brand { right: 6%; top: 20px; font-size: 1rem; }
    .screen {max-width: 60%;}


  }
</style>
</head>
<body>

<div class="stage">
  <div class="bg"><img src="bg-image.jpeg" alt=""></div>

  <div class="brand"><img src="logo.jpg" alt="" width="70" height="auto"> Food Review Blog</div>

  <!-- LOGIN SCREEN -->
  <section class="screen active" id="login-screen" aria-label="Login">
    <div class="icon-badge">🤝</div>
    <h1 class="title">Welcome back</h1>

    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="you@northsouth.edu" autocomplete="email">
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password">
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="next-btn">Next ➔</button>
      <button class="btn-ghost" id="to-register-btn">Signup</button>
    </div>

     <p class="switch-note"><a id="to-register-link"></a></p>
  </section>

  <!-- REGISTER SCREEN -->
  <section class="screen" id="register-screen" aria-label="Register">
    <div class="icon-badge">📝</div>
    <h1 class="title">Create your account</h1>

    <div class="field">
      <label for="reg-name">Name</label>
      <input id="reg-name" type="text" placeholder="Your full name" autocomplete="name">
    </div>
    <div class="field">
      <label for="reg-email">Email</label>
      <input id="reg-email" type="email" placeholder="you@northsouth.edu" autocomplete="email">
    </div>
    <div class="field">
      <label for="reg-password">Password</label>
      <input id="reg-password" type="password" placeholder="Create a password" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="reg-confirm">Confirm password</label>
      <input id="reg-confirm" type="password" placeholder="Re-enter password" autocomplete="new-password">
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="register-btn">Register 📩</button>
      <button class="btn-secondary" id="to-login-btn">Login ➔</button>
    </div>

     <p class="switch-note"><a id="to-login-link"></a></p>
  </section>


<div class="toast" id="toast"></div>



<script>
  const loginScreen = document.getElementById("login-screen");
  const registerScreen = document.getElementById("register-screen");
  const toast = document.getElementById("toast");

  function hideAllScreens() {
    loginScreen.classList.remove("active");
    registerScreen.classList.remove("active");
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2000);
  }

  function goToRegister() {
    hideAllScreens();
    registerScreen.classList.add("active");
  }

  function goToLogin() {
    hideAllScreens();
    loginScreen.classList.add("active");
  }

  //    SIGNUP PAGE 
  document.getElementById("to-register-btn").addEventListener("click", goToRegister);
  document.getElementById("to-register-link").addEventListener("click", goToRegister);

  //    LOGIN PAGE
  document.getElementById("next-btn").addEventListener("click", function () {

    const emailInput = document.getElementById("login-email");
    const passwordInput = document.getElementById("login-password");

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {
      showToast("Please enter your email");
      emailInput.focus();
      return;
    }

    if (!emailPattern.test(email)) {
      showToast("Please enter a valid email");
      emailInput.focus();
      return;
    }

    if (password === "") {
      showToast("Please enter your password");
      passwordInput.focus();
      return;
    }
    
      // LOGIN SUCCESS
      // Open links.html
    window.location.href = "home.html";

  });


  //    REGISTER VALIDATION
  document.getElementById("register-btn").addEventListener("click", function () {

    const nameInput = document.getElementById("reg-name");
    const emailInput = document.getElementById("reg-email");
    const passwordInput = document.getElementById("reg-password");
    const confirmInput = document.getElementById("reg-confirm");


    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmInput.value;

    const namePattern = /^[A-Za-z ]+$/;
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // NAME 
    if (name === "") {
      showToast("Please enter your name");
      nameInput.focus();
      return;
    }

    if (!namePattern.test(name)) {
      showToast("Name can contain letters and spaces only");
      nameInput.focus();
      return;
    }

    // EMAIL
    if (email === "") {
      showToast("Please enter your email");
      emailInput.focus();
      return;
    }

    if (!emailPattern.test(email)) {
      showToast("Please enter a valid email");
      emailInput.focus();
      return;
    }

    // PASSWORD
    if (password === "") {
      showToast("Please enter a password");
      passwordInput.focus();
      return;
    }

    if (password.length < 8) {
      showToast("Password must be at least 8 characters");
      passwordInput.focus();
      return;
    }

    if (!/[A-Za-z]/.test(password)) {
      showToast("Password must contain a letter");
      passwordInput.focus();
      return;
    }

    if (!/[0-9]/.test(password)) {
      showToast("Password must contain a number");
      passwordInput.focus();
      return;
    }

    // CONFIRM PASSWORD 
    if (confirmPassword === "") {
      showToast("Please confirm your password");
      confirmInput.focus();
      return;
    }

    if (password !== confirmPassword) {
      showToast("Passwords do not match");
      confirmInput.focus();
      return;
    }

    // SUCCESS
    showToast("Account created successfully");
    setTimeout(function () {
      goToLogin();
    }, 1000);

  });

  //    LOGIN BUTTON FROM REGISTER
  document.getElementById("to-login-btn").addEventListener("click", goToLogin);
  document.getElementById("to-login-link").addEventListener("click", goToLogin);

</script>
</body>
</html>
